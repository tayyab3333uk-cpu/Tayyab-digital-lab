<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" />
  
  <!-- Outer subtle tech ring -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="200" cy="180" r="120" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  
  <!-- Glowing Hexagon / Shield base -->
  <circle cx="200" cy="170" r="95" fill="#0b1120" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Developer Avatar Monogram TF -->
  <text x="200" y="175" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="64" fill="url(#accentGrad)">TF</text>
  <text x="200" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="3">FULL-STACK DEV</text>
  
  <!-- Status Badge at bottom -->
  <g transform="translate(100, 320)">
    <rect width="200" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="19" r="5" fill="#10b981" />
    <text x="110" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Tayyab Faisal</text>
  </g>
</svg>
