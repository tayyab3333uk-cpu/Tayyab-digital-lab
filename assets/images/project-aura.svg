<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#auraBg)" stroke="#27272a" stroke-width="2" />
  <circle cx="600" cy="250" r="220" fill="url(#goldGlow)" />

  <!-- Browser Header bar -->
  <rect width="800" height="42" rx="16" fill="#18181b" />
  <rect y="30" width="800" height="12" fill="#18181b" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="46" cy="21" r="5" fill="#f59e0b" />
  <circle cx="64" cy="21" r="5" fill="#10b981" />
  <!-- URL bar -->
  <rect x="95" y="10" width="380" height="22" rx="6" fill="#27272a" />
  <text x="110" y="25" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11">https://tayyab3333uk-cpu.github.io/AURA---WATCHES-/</text>
  <rect x="710" y="10" width="70" height="22" rx="6" fill="#3f3f46" />
  <text x="745" y="25" fill="#e4e4e7" font-family="sans-serif" font-size="10" text-anchor="middle">LIVE DEMO</text>

  <!-- Website Content Preview -->
  <!-- Top Navbar Mockup -->
  <rect x="40" y="60" width="720" height="50" rx="8" fill="#111115" stroke="rgba(212,175,55,0.3)" stroke-width="1" />
  <circle cx="70" cy="85" r="14" fill="url(#goldGrad)" />
  <text x="65" y="90" font-family="'Playfair Display', serif" font-weight="900" font-size="15" fill="#000">A</text>
  <text x="95" y="91" font-family="'Playfair Display', serif" font-weight="700" font-size="18" fill="url(#goldGrad)">AURA WATCHES</text>

  <text x="440" y="90" font-family="'Montserrat', sans-serif" font-size="12" fill="#d4d4d8" letter-spacing="1">COLLECTIONS</text>
  <text x="545" y="90" font-family="'Montserrat', sans-serif" font-size="12" fill="#d4d4d8" letter-spacing="1">CHRONO</text>
  <text x="630" y="90" font-family="'Montserrat', sans-serif" font-size="12" fill="#d4d4d8" letter-spacing="1">ABOUT</text>
  <rect x="700" y="73" width="45" height="24" rx="4" fill="#d4af37" />
  <text x="722" y="89" font-family="sans-serif" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">CART: 2</text>

  <!-- Hero Banner Mockup -->
  <g transform="translate(60, 150)">
    <rect width="180" height="24" rx="12" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
    <text x="90" y="16" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#d4af37" text-anchor="middle" letter-spacing="2">SWISS PRECISION</text>

    <text x="0" y="65" font-family="'Playfair Display', serif" font-weight="800" font-size="34" fill="#ffffff">Timeless Luxury</text>
    <text x="0" y="105" font-family="'Playfair Display', serif" font-weight="800" font-size="34" fill="url(#goldGrad)">Masterpieces.</text>
    <text x="0" y="140" font-family="'Montserrat', sans-serif" font-size="13" fill="#a1a1aa">Engineered with precision quartz &amp; sapphire glass.</text>
    <text x="0" y="160" font-family="'Montserrat', sans-serif" font-size="13" fill="#a1a1aa">Interactive live clock engine &amp; dynamic cart showcase.</text>

    <!-- Buttons -->
    <rect x="0" y="185" width="130" height="38" rx="6" fill="url(#goldGrad)" />
    <text x="65" y="209" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#000" text-anchor="middle" letter-spacing="1">EXPLORE MODEL</text>
    <rect x="145" y="185" width="115" height="38" rx="6" fill="transparent" stroke="#d4af37" stroke-width="1.5" />
    <text x="202" y="209" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11" fill="#d4af37" text-anchor="middle">VIEW CATALOG</text>
  </g>

  <!-- Watch Dial Mockup on Right -->
  <g transform="translate(560, 270)">
    <!-- Watch Case Outer -->
    <circle cx="0" cy="0" r="115" fill="#18181b" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="102" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
    <!-- Hour Markers -->
    <line x1="0" y1="-95" x2="0" y2="-82" stroke="#d4af37" stroke-width="3" />
    <line x1="95" y1="0" x2="82" y2="0" stroke="#d4af37" stroke-width="3" />
    <line x1="0" y1="95" x2="0" y2="82" stroke="#d4af37" stroke-width="3" />
    <line x1="-95" y1="0" x2="-82" y2="0" stroke="#d4af37" stroke-width="3" />
    <!-- Sub dial -->
    <circle cx="0" cy="35" r="28" fill="none" stroke="#52525b" stroke-width="1.5" />
    <text x="0" y="-30" font-family="'Playfair Display', serif" font-size="12" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">AURA</text>
    <text x="0" y="-18" font-family="'Montserrat', sans-serif" font-size="7" fill="#71717a" text-anchor="middle" letter-spacing="1">AUTOMATIC</text>
    <!-- Hands -->
    <line x1="0" y1="8" x2="28" y2="-48" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="8" x2="-52" y2="-15" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="12" x2="35" y2="55" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="0" cy="8" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Tag Pills footer -->
  <g transform="translate(50, 445)">
    <rect width="110" height="26" rx="6" fill="#1f2937" />
    <text x="55" y="17" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Bootstrap 5</text>
    <rect x="120" width="105" height="26" rx="6" fill="#1f2937" />
    <text x="172" y="17" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">JavaScript</text>
    <rect x="235" width="115" height="26" rx="6" fill="#1f2937" />
    <text x="292" y="17" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Live Clock</text>
    <rect x="360" width="140" height="26" rx="6" fill="#1f2937" />
    <text x="430" y="17" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Luxury E-Commerce</text>
  </g>
</svg>
