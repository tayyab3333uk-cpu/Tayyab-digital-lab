<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gamingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="cyberGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#gamingBg)" stroke="#1e293b" stroke-width="2" />
  <circle cx="580" cy="240" r="230" fill="url(#cyberGlow)" />

  <!-- Browser Header bar -->
  <rect width="800" height="42" rx="16" fill="#0f172a" />
  <rect y="30" width="800" height="12" fill="#0f172a" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="46" cy="21" r="5" fill="#f59e0b" />
  <circle cx="64" cy="21" r="5" fill="#10b981" />
  <!-- URL bar -->
  <rect x="95" y="10" width="380" height="22" rx="6" fill="#1e293b" />
  <text x="110" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://tayyab3333uk-cpu.github.io/Gaming-Devices-.com/</text>
  <rect x="710" y="10" width="70" height="22" rx="6" fill="#334155" />
  <text x="745" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">LIVE DEMO</text>

  <!-- Website Content Preview -->
  <!-- Top Navbar -->
  <rect x="40" y="60" width="720" height="50" rx="8" fill="#111827" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
  <text x="65" y="92" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#38bdf8">Reely<tspan fill="#a855f7">.</tspan></text>
  <text x="260" y="90" font-family="'Open Sans', sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">Home</text>
  <text x="330" y="90" font-family="'Open Sans', sans-serif" font-size="12" fill="#94a3b8">Computers ▾</text>
  <text x="440" y="90" font-family="'Open Sans', sans-serif" font-size="12" fill="#94a3b8">Laptops</text>
  <text x="520" y="90" font-family="'Open Sans', sans-serif" font-size="12" fill="#94a3b8">Peripherals</text>
  <rect x="680" y="73" width="60" height="24" rx="4" fill="url(#neonCyan)" />
  <text x="710" y="89" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">LOGIN</text>

  <!-- Hero Content Left -->
  <g transform="translate(60, 150)">
    <rect width="170" height="24" rx="12" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <text x="85" y="16" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ULTIMATE GEAR</text>

    <text x="0" y="65" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="#ffffff">Next-Gen Gaming</text>
    <text x="0" y="102" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="url(#neonPurple)">&amp; Workstations</text>
    <text x="0" y="136" font-family="'Open Sans', sans-serif" font-size="13" fill="#94a3b8">High-performance custom gaming PCs, battle-stations,</text>
    <text x="0" y="156" font-family="'Open Sans', sans-serif" font-size="13" fill="#94a3b8">and ultra-responsive creator workstations.</text>

    <!-- Buttons -->
    <rect x="0" y="180" width="130" height="38" rx="6" fill="url(#neonCyan)" />
    <text x="65" y="204" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#fff" text-anchor="middle">SHOP RIGS</text>
    <rect x="145" y="180" width="125" height="38" rx="6" fill="transparent" stroke="#38bdf8" stroke-width="1.5" />
    <text x="207" y="204" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">VIEW BENCHMARKS</text>
  </g>

  <!-- Right Visual: Gaming Rig Mockup -->
  <g transform="translate(540, 150)">
    <!-- PC Case Frame -->
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#030712" stroke="url(#neonPurple)" stroke-width="3" />
    <!-- Glass Panel Inner -->
    <rect x="12" y="12" width="156" height="216" rx="8" fill="#0b0f19" stroke="#1f2937" stroke-width="1" />
    
    <!-- RGB Fans -->
    <circle cx="90" cy="65" r="32" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="16 8" />
    <circle cx="90" cy="65" r="10" fill="#38bdf8" opacity="0.6" />

    <circle cx="90" cy="145" r="32" fill="none" stroke="url(#neonPurple)" stroke-width="4" stroke-dasharray="16 8" />
    <circle cx="90" cy="145" r="10" fill="#ec4899" opacity="0.6" />

    <!-- GPU Strip -->
    <rect x="25" y="195" width="130" height="18" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="90" y="208" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a78bfa" text-anchor="middle">RTX 4080 • OC</text>
  </g>

  <!-- Tag Pills footer -->
  <g transform="translate(50, 445)">
    <rect width="105" height="26" rx="6" fill="#1e293b" />
    <text x="52" y="17" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Bootstrap</text>
    <rect x="115" width="120" height="26" rx="6" fill="#1e293b" />
    <text x="175" y="17" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">AOS Animations</text>
    <rect x="245" width="115" height="26" rx="6" fill="#1e293b" />
    <text x="302" y="17" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Line Awesome</text>
    <rect x="370" width="125" height="26" rx="6" fill="#1e293b" />
    <text x="432" y="17" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Responsive Hub</text>
  </g>
</svg>
